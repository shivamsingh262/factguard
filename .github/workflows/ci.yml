name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false # report every combination, not just the first failure
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync
      - run: uv run pytest
      - name: lint
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: |
          uv run ruff format --check .
          uv run ruff check .

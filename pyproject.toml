[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "factguard"
version = "0.1.2"
description = "Keep LLM-written text free of numbers your code didn't compute: fact placeholders, a strict validator, one retry, then drop the sentence"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Shivam Singh" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["llm", "hallucination", "grounding", "ai-agents", "guardrails", "analytics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/shivamsingh262/factguard"
Issues = "https://github.com/shivamsingh262/factguard/issues"
"Design notes" = "https://shivamsingh262.com/notes/code-computes-llm-interprets/"

[project.scripts]
factguard = "factguard.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
